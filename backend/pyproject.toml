[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cpf-buddies-backend"
version = "0.1.0"
# 3.11 is the floor the rest of the repo is on; nothing here needs 3.12.
requires-python = ">=3.11"
dependencies = [
  # The wire contract. B is a separate deployable -- the agents are untrusted and
  # nothing downstream believes them -- but it speaks the same types as A and C.
  "trustrail",
  "boto3>=1.42,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[dependency-groups]
dev = [
  "boto3-stubs[bedrock-runtime]>=1.42,<2",
  "coverage[toml]>=7.6,<8",
  "mypy>=1.14,<2",
  "python-dotenv>=1.0,<2",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
