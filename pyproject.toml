[project]
name = "trustrail"
version = "0.1.0"
description = "A trust rail for agent payments: mandate issuance and settlement verification."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "fastapi>=0.115",
    "eth-keys>=0.6",
    "eth-utils>=5.1",
    # eth-utils leaves the keccak backend to the caller; without one, every
    # digest in this package raises at import-time of the first hash.
    "eth-hash[pycryptodome]>=0.7",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "uvicorn>=0.34",
    "moto[dynamodb]>=5.0",
    "boto3>=1.35",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
